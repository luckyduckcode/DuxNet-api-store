[package]
name = "duxnet"
version = "0.1.0"
edition = "2021"

[lib]
name = "duxnet"
path = "src/lib.rs"

[[bin]]
name = "duxnet"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"
ed25519-dalek = "2.0"
rand = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
hex = "0.4"
base64 = "0.21"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
sys-info = "0.9"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde_yaml = "0.9"
jsonschema = "0.17"
bollard = { version = "0.14", default-features = false }
chrono = { version = "0.4.41", features = ["serde"] }
bytes = "1.10.1"

# Database dependencies for PostgreSQL integration
# Database dependencies
sqlx = { version = "0.7.4", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "bigdecimal"] }
rust_decimal = { version = "1.34", features = ["serde-with-str"] }
deadpool-postgres = "0.10"
tokio-postgres = "0.7"

[dev-dependencies]
tokio-test = "0.4"
